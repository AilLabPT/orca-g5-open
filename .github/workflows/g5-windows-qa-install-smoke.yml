name: G5 Windows QA installer smoke - disposable VM

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Successful G5 QA packaging workflow run id
        type: string
        required: true
      expected_sha:
        description: Authorized exact 40-character checked-out source SHA
        type: string
        required: true
      expected_producer_head_sha:
        description: Exact producing workflow commit SHA
        type: string
        required: true
  push:
    branches: [g5-security-wip-20261116]
    paths:
      - '.github/workflows/g5-windows-qa-install-smoke.yml'

permissions:
  contents: read
  actions: read

jobs:
  qa-installer-smoke:
    if: github.repository == 'AilLabPT/orca-g5-open' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QA_RUN: ${{ inputs.qa_run_id }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      PRODUCER_HEAD: ${{ inputs.expected_producer_head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Authorize producing workflow and exact G5 SHA
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:QA_RUN -notmatch '^[0-9]{8,14}$' -or
             $env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$' -or
             $env:PRODUCER_HEAD -notmatch '^[a-f0-9]{40}$'){throw 'Invalid QA provenance selector'}
          $r=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QA_RUN"|ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or -not $r){throw 'QA run not accessible'}
          if($r.workflow_id -ne 420899596 -or $r.status -ne 'completed' -or
             $r.conclusion -ne 'success' -or $r.head_sha -ne $env:PRODUCER_HEAD -or
             $r.head_branch -ne 'g5-security-wip-20261116' -or
             $r.path -ne '.github/workflows/g5-windows-qa-package.yml' -or
             $r.event -ne 'workflow_dispatch'){throw 'QA producing run provenance mismatch'}
          Write-Host 'G5_QA_PRODUCER_APPROVED'
      - name: Download QA installer from exact producing run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.qa_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          name: g5-windows-qa-installer-test-signed
          path: qa-installer
      - name: Verify SHA256, embedded QA signer and source identity
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $proof=Join-Path $env:RUNNER_TEMP 'g5-qa-install'
          New-Item -ItemType Directory -Force -Path $proof|Out-Null
          $matches=@(Get-ChildItem 'qa-installer' -Filter '*TEST-SIGNED.exe' -File)
          if($matches.Count -ne 1){throw 'QA installer absent or ambiguous'}
          $exe=$matches[0].FullName
          $r=Get-Content 'qa-installer/qa-receipt.json' -Raw|ConvertFrom-Json
          if($r.sourceCommit -ne $env:SOURCE_SHA -or $r.testSignatureOnly -ne $true -or
             $r.publicCodeSigningTrustVerified -ne $false){throw 'QA identity/authority mismatch'}
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash
          if($hash -ne $r.testSignedSha256){throw 'QA installer SHA-256 mismatch'}
          $signature=Get-AuthenticodeSignature -FilePath $exe
          if(-not $signature.SignerCertificate -or
             $signature.SignerCertificate.Thumbprint -ne $r.signatureThumbprint){
            throw 'Embedded QA signer mismatch'
          }
          [ordered]@{sourceCommit=$env:SOURCE_SHA;sha256=$hash;qaSigner=$signature.SignerCertificate.Subject;
            signerThumbprint=$signature.SignerCertificate.Thumbprint;publicTrust=$false;
            status='metadata-verified'}|ConvertTo-Json|
            Set-Content -Encoding UTF8 (Join-Path $proof 'status.json')
          Write-Host 'G5_QA_SIGNED_FILE_SHA_AND_PROVENANCE_PASS'
      - name: Mark temporary signer trust as not qualified for release
        shell: pwsh
        run: Write-Host 'G5_QA_EMBEDDED_SIGNER_AND_HASH_VERIFIED_PUBLIC_CHAIN_UNTRUSTED'
      - name: Install real signed QA NSIS in clean disposable runner
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $existing=Join-Path $env:LOCALAPPDATA 'Programs/Orca/Orca.exe'
          if(Test-Path $existing){throw 'Cannot install over pre-existing Orca'}
          $exe=@(Get-ChildItem 'qa-installer' -Filter '*TEST-SIGNED.exe' -File)[0].FullName
          Write-Host 'G5_QA_NSIS_START'
          $p=Start-Process $exe -ArgumentList '/S' -PassThru
          try{
            if(-not $p.WaitForExit(180000)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw 'QA installer parent PID did not exit within 180 seconds'
            }
            if($p.ExitCode -ne 0){throw ('QA NSIS installer exit code: '+$p.ExitCode)}
          }finally{$p.Dispose()}
          Write-Host 'G5_QA_NSIS_PARENT_EXIT_OK'
      - name: Verify newly installed application executable
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:LOCALAPPDATA 'Programs/Orca/Orca.exe'
          for($i=0;$i -lt 60 -and -not(Test-Path $target);$i++){Start-Sleep -Seconds 1}
          if(-not(Test-Path $target)){throw 'QA app executable not installed'}
          $data=Get-Content (Join-Path $env:RUNNER_TEMP 'g5-qa-install/status.json') -Raw |ConvertFrom-Json
          if($data.sourceCommit -ne $env:SOURCE_SHA){throw 'QA installed source mismatch'}
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($target)
          [ordered]@{
            sourceCommit=$env:SOURCE_SHA
            setupSha256=$data.sha256
            installedExeSha256=(Get-FileHash -Algorithm SHA256 $target).Hash
            installedExeVersion=$v.FileVersion
            actualNSISInstallPassed=$true
            QAOnlyTestSignature=$true
            publiclyTrustedSigning=$false
            productionGO=$false
          } |ConvertTo-Json|Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'g5-qa-install/status.json')
          Write-Host 'G5_QA_ISOLATED_INSTALL_PASS'
      - name: Upload QA install evidence and phase receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g5-windows-qa-install-receipt
          path: ${{ runner.temp }}/g5-qa-install/
          if-no-files-found: warn
          retention-days: 3
